services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productcrud-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  api:
    build:
      context: ./backend
      dockerfile: ProductCrud.Api/Dockerfile

    container_name: productcrud-api

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductCrudDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "ProductCrud.Api"
      Jwt__Audience: "ProductCrud.Angular"
      Jwt__ExpiresMinutes: "120"

    ports:
      - "5081:8080"

    depends_on:
      sqlserver:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend/product-crud-ui
      dockerfile: Dockerfile

    container_name: productcrud-frontend

    ports:
      - "4200:80"

    depends_on:
      - api


volumes:
  sqlserver_data: