services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productcrud-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: productcrud-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:2026.1
    container_name: productcrud-seq

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"

    ports:
      - "127.0.0.1:5342:80"

    expose:
      - "5341"

    volumes:
      - seq_data:/data

  api:
    build:
      context: ./backend
      dockerfile: ProductCrud.Api/Dockerfile

    container_name: productcrud-api

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductCrudDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "ProductCrud.Api"
      Jwt__Audience: "ProductCrud.Angular"
      Jwt__ExpiresMinutes: "120"

      Redis__ConnectionString: "redis:6379"

      Seq__ServerUrl: "http://seq:5341"

    ports:
      - "5081:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy  
      seq:
        condition: service_started

  gateway:
    build:
      context: ./backend
      dockerfile: ProductCrud.Gateway/Dockerfile

    container_name: productcrud-gateway

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ReverseProxy__Clusters__apiCluster__Destinations__apiDestination__Address: "http://api:8080/"

    ports:
      - "5082:8080"

    depends_on:
      api:
        condition: service_started
        
  frontend:
    build:
      context: ./frontend/product-crud-ui
      dockerfile: Dockerfile

    container_name: productcrud-frontend

    ports:
      - "4200:80"

    depends_on:
      gateway:
        condition: service_started


volumes:
  sqlserver_data:
  seq_data: