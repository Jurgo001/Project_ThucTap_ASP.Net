x-api-common: &api-common
  image: productcrud-api:week-scale

  environment:
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"

    ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductCrudDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

    Jwt__Key: "${JWT_KEY}"
    Jwt__Issuer: "ProductCrud.Api"
    Jwt__Audience: "ProductCrud.Angular"
    Jwt__ExpiresMinutes: "120"

    Redis__ConnectionString: "redis:6379"
    Seq__ServerUrl: "http://seq:5341"

  volumes:
    - api_uploads:/app/wwwroot/uploads

  depends_on:
    sqlserver:
      condition: service_healthy
    redis:
      condition: service_healthy
    seq:
      condition: service_started

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productcrud-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: productcrud-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:2026.1
    container_name: productcrud-seq

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"

    ports:
      - "127.0.0.1:5342:80"

    expose:
      - "5341"

    volumes:
      - seq_data:/data

  gateway:
    build:
      context: ./backend
      dockerfile: ProductCrud.Gateway/Dockerfile

    container_name: productcrud-gateway

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ReverseProxy__Clusters__apiCluster__LoadBalancingPolicy: "RoundRobin"

      ReverseProxy__Clusters__apiCluster__Destinations__apiDestination__Address: "http://api-web1:8080/"
      ReverseProxy__Clusters__apiCluster__Destinations__apiDestination2__Address: "http://api-web2:8080/"
      ReverseProxy__Clusters__apiCluster__Destinations__apiDestination3__Address: "http://api-web3:8080/"
      ReverseProxy__Clusters__apiCluster__HealthCheck__AvailableDestinationsPolicy: "HealthyAndUnknown"

      ReverseProxy__Clusters__apiCluster__HealthCheck__Active__Enabled: "true"
      ReverseProxy__Clusters__apiCluster__HealthCheck__Active__Interval: "00:00:02"
      ReverseProxy__Clusters__apiCluster__HealthCheck__Active__Timeout: "00:00:01"
      ReverseProxy__Clusters__apiCluster__HealthCheck__Active__Policy: "ConsecutiveFailures"
      ReverseProxy__Clusters__apiCluster__HealthCheck__Active__Path: "/health"

      ReverseProxy__Clusters__apiCluster__Metadata__ConsecutiveFailuresHealthPolicy.Threshold: "1"

    depends_on:
      api-web1:
        condition: service_started
      api-web2:
        condition: service_started
      api-web3:
        condition: service_started
        
  frontend:
    build:
      context: ./frontend/product-crud-ui
      dockerfile: Dockerfile

    container_name: productcrud-frontend

    ports:
      - "4200:80"

    depends_on:
      gateway:
        condition: service_started

  api-web1:
    <<: *api-common
    container_name: api-web1

    build:
      context: ./backend
      dockerfile: ProductCrud.Api/Dockerfile

    ports:
      - "5001:8080"

  api-web2:
    <<: *api-common
    container_name: api-web2

    build:
      context: ./backend
      dockerfile: ProductCrud.Api/Dockerfile

    ports:
      - "5002:8080"

  api-web3:
    <<: *api-common
    container_name: api-web3

    build:
      context: ./backend
      dockerfile: ProductCrud.Api/Dockerfile

    ports:
      - "5003:8080"

volumes:
  sqlserver_data:
  seq_data:
  api_uploads:
