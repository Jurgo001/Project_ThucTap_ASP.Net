name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Angular Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/product-crud-ui

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/product-crud-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production
        run: npm run build -- --configuration production

  api-build:
    name: .NET API Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore API dependencies
        run: dotnet restore backend/ProductCrud.Api/ProductCrud.Api.csproj

      - name: Build API
        run: >
          dotnet build
          backend/ProductCrud.Api/ProductCrud.Api.csproj
          --configuration Release
          --no-restore

  gateway-build:
    name: .NET Gateway Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore Gateway dependencies
        run: dotnet restore backend/ProductCrud.Gateway/ProductCrud.Gateway.csproj

      - name: Build Gateway
        run: >
          dotnet build
          backend/ProductCrud.Gateway/ProductCrud.Gateway.csproj
          --configuration Release
          --no-restore

  frontend-docker-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build frontend Docker image
        run: docker build -t productcrud-frontend:ci frontend/product-crud-ui

      - name: Verify frontend Docker image
        run: docker image inspect productcrud-frontend:ci

  api-docker-build:
    name: API Docker Build
    runs-on: ubuntu-latest
    needs:
      - api-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build API Docker image
        run: docker build -t productcrud-api:ci -f backend/ProductCrud.Api/Dockerfile backend

      - name: Verify API Docker image
        run: docker image inspect productcrud-api:ci

  gateway-docker-build:
    name: Gateway Docker Build
    runs-on: ubuntu-latest
    needs:
      - gateway-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build Gateway Docker image
        run: >
          docker build
          -t productcrud-gateway:ci
          -f backend/ProductCrud.Gateway/Dockerfile
          backend

      - name: Verify Gateway Docker image
        run: docker image inspect productcrud-gateway:ci
