name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/product-crud-ui

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/product-crud-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production
        run: npm run build -- --configuration production

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/ProductCrud.Api/ProductCrud.Api.csproj

      - name: Build API
        run: >
          dotnet build
          backend/ProductCrud.Api/ProductCrud.Api.csproj
          --configuration Release
          --no-restore
